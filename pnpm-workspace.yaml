allowBuilds:
  esbuild: false
  workerd: false

# The @cloudflare/vitest-plugin preview build of https://github.com/cloudflare/workers-sdk/pull/15500 declares its workspace siblings as pkg.pr.new URLs, which pnpm rejects as exotic subdeps.
# That PR touches only packages/vitest-plugin, so these pin back to what the published 1.1.4 resolves.
overrides:
  '@cloudflare/vitest-plugin>miniflare': 5.20260903.0-alpha
  '@cloudflare/vitest-plugin>wrangler': 4.129.0
