name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      # anti-slop is a submodule, and oxlint fails to start without it.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      # .dev.vars is gitignored, so the secret names come from the committed
      # example instead — without them the three `env.*` reads have no type.
      - name: Generate Worker types
        run: pnpm exec wrangler types --env-file .dev.vars.example

      - name: Lint
        run: pnpm exec oxlint

      - name: Check formatting
        run: pnpm exec oxfmt --check

      # Before the tests, not after: the `dist` vitest project asserts over the
      # built output and has no way to produce it itself.
      - name: Build
        run: pnpm exec vite build

      - name: Test
        run: pnpm exec vitest run

      # Hydration is the one failure class nothing above can see: oxlint reads
      # source, the build renders but never hydrates, and both vitest projects
      # run without a DOM.
      - name: Read the pinned Playwright version
        id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

      # ubuntu-24.04-arm ships no Chromium, and so none of the shared libraries
      # one drags in either — unlike the x64 image, where they arrive with it.
      # apt is system-wide, so the cache below cannot skip this step.
      - name: Install Playwright's system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Headless is all this runs, and the full chromium build is 640MB of the
      # 984MB a plain install writes.
      - name: Install the Playwright browser
        run: pnpm exec playwright install --only-shell chromium

      - name: Smoke-test hydration
        run: pnpm exec playwright test

      - name: Upload the failing traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
